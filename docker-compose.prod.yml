# Override di produzione per il solo reverse proxy.
#
# Si applica IN AGGIUNTA al compose base, NON lo sostituisce:
#   docker compose -f docker-compose.dev.yml -f docker-compose.prod.yml up -d --build caddy
#
# Cosa cambia rispetto al placeholder dev (docker-compose.dev.yml → caddy):
#   - build custom (Dockerfile con modulo DNS Cloudflare) al posto di image: caddy:2-alpine
#   - espone 80/443 (TCP) + 443/UDP (HTTP/3) sull'host, non più 8080:80
#   - monta la dir infra/caddy/conf (wildcard) invece del placeholder ./Caddyfile
#   - inietta CF_API_TOKEN + ACME_EMAIL dall'ambiente (file .env)
#
# I volumi caddy_data/caddy_config sono gli stessi del base: ci vivono i certificati
# Let's Encrypt → DEVONO finire nel backup (vedi ADR-0001 "Negative" e ADR-0041).

services:
  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    image: gestionale/caddy-cloudflare:2.11
    # !override: rimpiazza la lista ports del base invece di concatenarla
    # (altrimenti resterebbe pubblicata anche la 8080:80 del dev). Richiede
    # Compose >= 2.24; qui v5.x. Vedi ADR-0041.
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3 (QUIC)
    # !override: il base dev monta il file ./Caddyfile su /etc/caddy/Caddyfile;
    # qui montiamo la DIRECTORY infra/caddy/conf su /etc/caddy. Si rimpiazza la
    # lista intera (mount di file e di dir sullo stesso path sono incompatibili).
    # Montare la dir (non il singolo file) evita il gotcha del bind-mount per-inode:
    # le modifiche al Caddyfile vengono viste dal container e `caddy reload` funziona.
    volumes: !override
      - ./infra/caddy/conf:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Valorizzati dal file .env (gitignored). MAI committare i valori reali.
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN mancante in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL mancante in .env}
    # Reti: gestionale_network (servizi del gestionale, dal compose base) + web
    # (rete esterna condivisa col container lumimondo-adventure per il
    # reverse_proxy via DNS docker). Esplicite qui così il recreate del caddy le
    # rende persistenti, senza dipendere da `docker network connect` a caldo.
    networks:
      - gestionale_network
      - web

  # ── App del gestionale dietro il proxy (ADR-0042 §1) ──────────────────────────
  # Build dal context repo-root: i Dockerfile COPYano apps/ + packages/ del
  # workspace pnpm. NESSUNA porta pubblicata sull'host: raggiungibili solo da
  # Caddy via service name sulla gestionale_network (come postgres/redis).
  # NB: caddy NON ha depends_on su questi servizi di proposito — il proxy live
  # (che serve anche gli host co-locati) non deve dipendere dal loro ciclo di vita.
  accountant-api:
    build:
      context: .
      dockerfile: apps/accountant-api/Dockerfile
    image: gestionale/accountant-api
    restart: unless-stopped
    # JWT/Throttle/Lockout/SMTP dal .env; override sotto per le var host-specific
    # (dentro la rete si usa il service name, non 127.0.0.1 = il container stesso).
    env_file:
      - .env
    environment:
      PORT: '3002'
      REDIS_HOST: redis
      # SMTP_HOST/_PORT del .env puntano a 127.0.0.1:1025 (mailpit via host).
      # Nel container il MTA dev si raggiunge per service name (vedi REDIS_HOST).
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # DATABASE_URL/DIRECT_URL del .env puntano a 127.0.0.1 (migration eseguite
      # sull'host). Nel container servono le varianti host=postgres, stessi
      # credenziali+encoding: vanno aggiunte a .env (vedi nota nel report).
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER mancante in .env (variante host=postgres)}
      DIRECT_URL: ${DIRECT_URL_DOCKER:?DIRECT_URL_DOCKER mancante in .env (variante host=postgres)}
      # Same-origin (routing path-based /api/*) -> CORS di fatto non scatta;
      # valore di sicurezza per eventuali richieste cross-origin.
      CORS_ORIGIN: https://studiodesk.cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gestionale_network

  accountant-web:
    build:
      context: .
      dockerfile: apps/accountant-web/Dockerfile
    image: gestionale/accountant-web
    restart: unless-stopped
    # Next standalone (server.js) legge PORT/HOSTNAME a runtime. HOSTNAME 0.0.0.0
    # obbligatorio in container (il default localhost non accetta connessioni
    # esterne). NEXT_PUBLIC_API_URL=/api/v1 è inlined a build-time nel Dockerfile.
    environment:
      PORT: '3003'
      HOSTNAME: '0.0.0.0'
    depends_on:
      - accountant-api
    networks:
      - gestionale_network

  # ── Verticale ristorazione (food.studiodesk.cloud) ──────────────────────────
  # Stesso pattern dei servizi accountant: porte interne 3004/3005 NON pubblicate
  # sull'host (solo Caddy le raggiunge per service name sulla gestionale_network).
  restaurant-api:
    build:
      context: .
      dockerfile: apps/restaurant-api/Dockerfile
    image: gestionale/restaurant-api
    restart: unless-stopped
    # JWT/Throttle/Lockout/SMTP + GROQ_API_KEY dal .env (AI futura eredita da qui);
    # override sotto per le var host-specific (service name dentro la rete).
    env_file:
      - .env
    environment:
      PORT: '3004'
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # DATABASE_URL/DIRECT_URL del .env puntano a 127.0.0.1 (host); nel container
      # servono le varianti host=postgres (stesse credenziali+encoding).
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER mancante in .env (variante host=postgres)}
      DIRECT_URL: ${DIRECT_URL_DOCKER:?DIRECT_URL_DOCKER mancante in .env (variante host=postgres)}
      # Same-origin (routing path-based /api/* su food.studiodesk.cloud) -> CORS di
      # fatto non scatta; valore di sicurezza per eventuali richieste cross-origin.
      CORS_ORIGIN: https://food.studiodesk.cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gestionale_network

  restaurant-web:
    build:
      context: .
      dockerfile: apps/restaurant-web/Dockerfile
    image: gestionale/restaurant-web
    restart: unless-stopped
    # Next standalone (server.js) legge PORT/HOSTNAME a runtime. HOSTNAME 0.0.0.0
    # obbligatorio in container. NEXT_PUBLIC_API_URL=/api/v1 è inlined a build-time.
    environment:
      PORT: '3005'
      HOSTNAME: '0.0.0.0'
    depends_on:
      - restaurant-api
    networks:
      - gestionale_network

# `web` è external: la sua vita non è legata a questo compose (la crea/possiede
# l'operatore una tantum: `docker network create web`). Vedi ADR-0042.
networks:
  web:
    external: true
