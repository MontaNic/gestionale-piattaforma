# Dev stack: Postgres + Redis + Caddy placeholder.
# Servizi applicativi (api, web, kds) e infrastruttura ulteriore (minio, meilisearch,
# unleash) verranno aggiunti man mano che i workspace li richiedono.
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestionale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # D3b: propagata allo script 01-create-app-role.sh per CREATE ROLE
      # gestionale_app al primo bootstrap del volume. Vedi ADR-0009.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # Binding solo su 127.0.0.1 -> raggiungibile da prisma migrate eseguito sul
      # server (host) ma NON dall'esterno. L'API in container continuera a usare
      # service name "postgres:5432" via gestionale_network. Vedi ADR-0005.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts: girano SOLO al primo bootstrap quando il volume e' vuoto
      # (/var/lib/postgresql/data assente). Su volume esistente sono inerti.
      # Vedi infra/postgres/init/01-create-app-role.sh per dettagli + ADR-0009
      # sezione "D3b — Activation".
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gestionale_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gestionale_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      # Pattern simmetrico al postgres binding sopra: 127.0.0.1-only.
      # apps/api gira sull'host (ts-node-dev) e deve raggiungere Redis via
      # localhost per rate limiting + lockout (B1, ADR-0013). Quando l'API
      # verra' containerizzata, il binding host potra' essere rimosso
      # (parla via service name "redis" sulla network bridge).
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - gestionale_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # TODO[staging/prod]: aggiungere --requirepass ${REDIS_PASSWORD} (vedi .env.example).

  caddy:
    image: caddy:2-alpine
    container_name: gestionale_caddy
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gestionale_network
    # Placeholder: niente 443/Let's Encrypt finché non avremo dominio (vedi
    # docs/architecture/ADR-0001-caddy-as-container.md → "Notes" su ADR-0002 futuro).

networks:
  gestionale_network:
    name: gestionale_network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
