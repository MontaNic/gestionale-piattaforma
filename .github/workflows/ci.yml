name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version letta dal campo `packageManager` di package.json (pnpm@9.15.0)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # @prisma/client e' uno stub vuoto on npm; i tipi reali sono generati
        # da `prisma generate` leggendo schema.prisma. Necessario in CI perche'
        # in locale lo stesso lavoro lo fa implicitamente `prisma migrate dev`
        # (eseguito durante lo sviluppo, non in CI). Senza questo step, il
        # typecheck di packages/db fallisce con "no exported member 'Prisma'".
        run: pnpm --filter @gestionale/db exec prisma generate

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck
