name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version letta dal campo `packageManager` di package.json (pnpm@9.15.0)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # @prisma/client e' uno stub vuoto on npm; i tipi reali sono generati
        # da `prisma generate` leggendo schema.prisma. Necessario in CI perche'
        # in locale lo stesso lavoro lo fa implicitamente `prisma migrate dev`
        # (eseguito durante lo sviluppo, non in CI). Senza questo step, il
        # typecheck di packages/db fallisce con "no exported member 'Prisma'".
        run: pnpm --filter @gestionale/db exec prisma generate

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Contratto ADR-0062 — nessuna route Next sotto /api/
        # /api/* è riservato al backend NestJS same-origin (Caddy handle /api/*).
        # Una route Next lì viene ingoiata dal proxy in prod → 404 (bug cambio lingua).
        run: bash scripts/check-no-api-next-routes.sh

      - name: Vitest
        # turbo run test -> propaga ai workspace con script `test`.
        # Workspace senza spec files passano via --passWithNoTests.
        run: pnpm test

  seed-rls-core:
    name: Seed + RLS core (Postgres reale · gestionale_app)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ri-alloggio di DUE presidi che vivevano dentro il job `e2e-playwright`
    # (rimosso insieme al verticale restaurant) e che non sono restaurant-specifici:
    #
    #  1. `db:seed` su Postgres reale — l'UNICA esecuzione del seed in CI. Senza,
    #     una rottura del seed non viene più intercettata da nulla.
    #  2. `smoke:rls-core` — l'unico presidio che esercita la RLS DB-level sulle
    #     tabelle CORE (tenants/sedi/users/roles/user_roles/audit_logs) come
    #     `gestionale_app` NOSUPERUSER/NOBYPASSRLS. I job `e2e-rls-domain-*`
    #     coprono il DOMINIO, non il core: non sono un sostituto.
    #
    # Perché un job a sé e non due step dentro `checks`: `checks` è il gate veloce
    # (lint/typecheck/format/vitest, nessun `services:`) e attaccargli un Postgres
    # ne allungherebbe OGNI run, incluso quello di una PR di sola documentazione.
    # Il pattern "un job per presidio, needs: [checks]" è già quello degli altri
    # tre job e2e di questo file.
    #
    # Gira su `ubuntu-latest` e NON dentro `container:` → i service container si
    # raggiungono su `localhost` via il mapping `ports:`, NON per service name.
    # È la differenza rispetto al job Playwright rimosso, che girava DENTRO il
    # container Playwright e per questo usava `postgres:5432`.
    #
    # Nessun Redis, nessun Mailpit: né il seed né lo smoke li toccano.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-superuser-test-only
          POSTGRES_DB: gestionale_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # `localhost` (non `postgres`): vedi la nota sul mapping `ports:` sopra.
      # Il DB si chiama `gestionale_test`, quindi il guard anti-prod-da-host
      # (`assert-safe-db-target`, che protegge `{127.0.0.1|localhost}:5432/gestionale`)
      # non scatta: il match è su host:porta:DB e il nome non coincide.
      DIRECT_URL: postgresql://postgres:ci-postgres-superuser-test-only@localhost:5432/gestionale_test?schema=public
      POSTGRES_PASSWORD: ci-postgres-superuser-test-only
      APP_DB_PASSWORD: ci-app-role-test-only-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write root .env for CI
        # Gli script di `packages/db` caricano il `.env` di root via path fisso
        # (`dotenv -e ../../.env`): il file va creato, non basta la env di job.
        # Minimale di proposito — qui non gira nessuna API: solo le variabili DB.
        # `DATABASE_URL` nasce uguale a `DIRECT_URL` (superuser) perché serve alle
        # migration; viene riscritta sul role applicativo dopo il rotate.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=gestionale_test
          APP_DB_PASSWORD=${{ env.APP_DB_PASSWORD }}
          DIRECT_URL=${{ env.DIRECT_URL }}
          DATABASE_URL=${{ env.DIRECT_URL }}
          EOF

      - name: Generate Prisma client
        run: pnpm --filter @gestionale/db exec prisma generate

      - name: Run Prisma migrations
        # `migrate deploy` (non `dev`): CI non-interattiva, applica solo le
        # migration committate. Crea lo schema + il role `gestionale_app` con
        # password PLACEHOLDER, ruotata dallo step successivo.
        run: pnpm --filter @gestionale/db prisma:migrate:deploy

      - name: Rotate gestionale_app role password
        # La migration 20260513002159 crea il role con una password PLACEHOLDER
        # che DEVE essere ruotata (vedi header di quella migration.sql).
        #
        # ⚠️ NIENTE `apt-get install postgresql-client` (TD-ci-apt-external-dep):
        # un presidio di CI non può dipendere da una risorsa di rete che il repo
        # non controlla. Si usa `pg`, già dipendenza del workspace e già
        # installata dallo step `pnpm install`.
        #
        # `working-directory` è `apps/accountant-api` — era `apps/restaurant-api`
        # nel job rimosso; `pg` è dipendenza di entrambe, e l'accountant resta.
        #
        # La password NON passa per argv (il runner echeggia la riga nel log ed è
        # visibile in `ps`): si legge dalla env di JOB, e non si dichiara alcuna
        # env di step (un alias `PGPASSWORD:` la ristamperebbe nel preambolo).
        # `ALTER ROLE` è una utility statement e non accetta bind parameter → il
        # valore va interpolato, ma quotato con `escapeLiteral` del driver.
        working-directory: apps/accountant-api
        run: |
          node -e '
            const { Client } = require("pg");
            const c = new Client({ connectionString: process.env.DIRECT_URL });
            c.connect()
              .then(() => c.query("ALTER ROLE gestionale_app PASSWORD " + c.escapeLiteral(process.env.APP_DB_PASSWORD)))
              .then(() => c.end())
              .then(() => { console.log("gestionale_app: password ruotata"); process.exit(0); })
              .catch((e) => { console.error("Rotate fallito:", e.message); process.exit(1); });
          '

      - name: Update .env with real DATABASE_URL (post-rotate)
        # Lo smoke DEVE connettersi come `gestionale_app` (NOSUPERUSER, RLS
        # applicata): se restasse sul superuser lo scenario S0 fallirebbe — ed è
        # esattamente il suo scopo, impedire un verde cieco.
        run: |
          ENC_PWD=$(node -e "console.log(encodeURIComponent(process.env.APP_DB_PASSWORD))")
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://gestionale_app:${ENC_PWD}@localhost:5432/gestionale_test?schema=public|" .env

      - name: Seed database
        # Presidio (1). `db:seed` forza NODE_ENV=development → il ramo dev-data
        # gira (guard fail-closed di ADR-0080).
        run: pnpm --filter @gestionale/db db:seed

      - name: RLS core-only enforcement (gestionale_app, non-superuser)
        # Presidio (2). Non-distruttivo: legge i dati del seed e verifica che gli
        # INSERT cross-tenant vengano RESPINTI (nulla persiste sul PASS path).
        # Exit != 0 → falla di isolamento reale, non un test da riprovare.
        run: pnpm --filter @gestionale/db smoke:rls-core

  e2e-accountant-web-blob:
    name: E2E accountant-web blob (route-mocked)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TD-ci-e2e-accountant-web-fe: la spec blob-auth-refresh.spec.ts esisteva ma
    # non era CI-gata (l'unico job Playwright del file eseguiva solo restaurant-web,
    # rimosso col verticale). E' route-mocked (page.route() simula 401 +
    # /auth/refresh) → NESSUN backend, NESSUN DB, solo `next dev` isolato su :3013.
    # Container Playwright pinned = stessa versione del client (@playwright/test 1.60.0).
    #
    # ⚠️ Dopo la rimozione del restaurant questa e' l'UNICA spec Playwright in CI, ed
    # e' mockata: nessun job apre piu' un browser vero contro un backend vero.
    # Vedi TD-ci-e2e-accountant-api.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # accountant-web compila via transpilePackages i @gestionale/* SOURCE-export
        # (api-client, auth-web); il client Prisma (@prisma/client stub) va generato
        # per i type import transitivi. Cheap insurance, coerente col job `checks`.
        run: pnpm --filter @gestionale/db exec prisma generate

      - name: Build accountant-web workspace deps
        # I @gestionale/* DIST-export (shared, ui, i18n, …) NON sono transpilePackages:
        # `next dev` li risolve da dist/. Senza build → "Module not found:
        # @gestionale/shared" → next dev non compila → webServer timeout. `^...`
        # builda le dipendenze di accountant-web (salta i source-export senza build).
        run: pnpm --filter "@gestionale/accountant-web^..." build

      - name: Run blob e2e (route-mocked · next dev :3013 · no BE/DB)
        working-directory: apps/accountant-web
        run: pnpm test:e2e:blob

  e2e-rls-domain-accountant:
    name: E2E domain RLS accountant (testcontainers · gestionale_app)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Porta in CI gli spec RLS DB-level del verticale ACCOUNTANT (rls-isolation +
    # note-spese-rls-isolation) come `gestionale_app` (NOBYPASSRLS) → una regressione
    # di policy RLS su tabelle accountant rompe la CI. Testcontainers dedicati
    # (DP-1, no service-DB), su ubuntu-latest (Docker host).
    # Nato come gemello di `e2e-rls-domain` (restaurant), rimosso col verticale:
    # da allora e' l'unico gate RLS di DOMINIO. Il core lo copre `seed-rls-core`.
    # NON copre le altre 23 spec e2e comportamentali di accountant-api
    # (resta TD-ci-e2e-accountant-api, oggi il primo debito di copertura del repo).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gestionale/db exec prisma generate

      - name: Build workspace packages (db + shared + platform + auth)
        # test:e2e:rls avvia vitest diretto (no turbo ^build); rls-isolation boota
        # AppModule → auth/platform/shared.
        run: pnpm --filter @gestionale/db --filter @gestionale/shared --filter @gestionale/platform --filter @gestionale/auth build

      - name: Run accountant domain RLS e2e (Testcontainers, gestionale_app NOBYPASSRLS)
        # SOLO rls-isolation (selezione esplicita in test:e2e:rls). Testcontainers
        # propri; migrate deploy crea gestionale_app (placeholder); setup superuser,
        # assert app-role (toAppRoleUrl).
        run: pnpm --filter @gestionale/accountant-api test:e2e:rls
